<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>投研日程排期看板</title>
<style>
:root{
  color-scheme:light;
  --navy:#1C4885; --navy2:#163A6C; --gold:#B8943C; --gold2:#D8B660;
  --bg:#F6F8FB; --surface:#FFFFFF; --surface2:#F6F8FB; --tint:#E8ECF1; --tint2:#EEF2F7;
  --ink:#2E3A4D; --muted:#6B7280; --faint:#9AA3AF; --sub:#4B5566;
  --line:#D7DDE5; --line2:#E8ECF1; --accent:#1C4885; --accent-ink:#FFFFFF; --hover:#EEF2F7;
  --s1:#1C4885; --s2:#2E7D5B; --s3:#B8943C; --s4:#8A6A3F; --s5:#6A4C93; --s6:#4B5566; --s7:#2A6FB9; --s8:#5E7A2E;
  --exp-bg:#F8ECEE; --exp-ink:#B23A48; --corp-bg:#EEF1F5; --corp-ink:#4B5566;
  --ok:#2E7D5B; --warn:#B8943C; --off:#9AA3AF; --mix:13%;
  --serif:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --sans:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:"DIN Alternate","Bahnschrift","Helvetica Neue",Arial,"PingFang SC",sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5}
.wrap{max-width:1440px;margin:0 auto;padding-inline:20px;padding-block:20px 48px}
button,input,select{font:inherit;color:inherit}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;border-bottom:1px solid var(--line)}
.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted)}
h1{font-family:var(--serif);font-size:26px;font-weight:700;margin:2px 0 0;letter-spacing:.02em}
.week{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:13px;color:var(--muted);flex-wrap:wrap}
.week b{color:var(--ink);font-weight:600}
.tag-demo{font-family:var(--sans);font-size:12px;padding:2px 8px;border:1px dashed var(--faint);border-radius:4px;color:var(--muted)}
.tabs{display:flex;gap:4px;margin:16px 0 18px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:4px;width:fit-content;max-width:100%;flex-wrap:wrap}
.tab{border:0;background:transparent;padding:7px 16px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500}
.tab:hover{background:var(--hover);color:var(--ink)}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}

/* shared bits */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;line-height:1;padding:4px 7px;border-radius:4px;white-space:nowrap;
  color:var(--c);background:color-mix(in srgb,var(--c) var(--mix),transparent);font-weight:500}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--c)}
.kw{display:inline-block;font-size:11.5px;padding:2px 6px;border:1px solid var(--line);border-radius:3px;color:var(--muted);margin:0 4px 4px 0}
.st{display:inline-flex;align-items:center;gap:4px;font-size:12px;white-space:nowrap}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c)}
.st.onsite{--c:var(--ok)} .st.online{--c:var(--warn)} .st.absent{--c:var(--off);color:var(--muted)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;min-width:0}
.panel h3{margin:0 0 2px;font-size:15px;font-family:var(--serif)}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:12px}
.none{padding:18px 12px;color:var(--faint);font-size:12.5px}

/* day picker */
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;flex:1 1 620px;max-width:1080px}
.day.we{border-style:dashed;background:var(--surface2)}
.day.we .n{color:var(--muted)}
.day{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.day:hover{border-color:var(--accent)}
.day .w{font-weight:600}
.day .d{font-family:var(--mono);font-size:12px;color:var(--muted)}
.day .n{font-size:12px;color:var(--muted)}
.day[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.day[aria-pressed="true"] .w{color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{border:1px solid var(--line);background:var(--surface);padding:5px 10px;border-radius:999px;font-size:12.5px;cursor:pointer;color:var(--muted)}
.fbtn:hover{color:var(--ink)}
.fbtn[aria-pressed="true"]{color:var(--ink);border-color:var(--ink)}
.fbtn i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--c);margin-right:5px}

/* schedule grid */
.gridbox{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow-x:auto}
.grid{display:grid;grid-template-columns:78px repeat(10,minmax(140px,1fr));min-width:max-content}
.grid>div{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2)}
.gh{background:var(--surface2);padding:9px 10px;font-family:var(--mono);font-weight:600;font-size:13px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.gh small{font-weight:400;color:var(--muted);font-size:11px}
.gt{position:sticky;left:0;z-index:1;background:var(--surface2);padding:10px 8px;font-family:var(--mono);font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.gt span{color:var(--faint);font-size:11px}
.corner{position:sticky;left:0;z-index:2;font-family:var(--sans);font-weight:400;color:var(--muted);font-size:12px}
.lunch{grid-column:1/-1;background:repeating-linear-gradient(135deg,var(--surface2) 0 6px,var(--bg) 6px 12px);padding:5px 12px;font-size:12px;color:var(--muted)}
.lunch span{position:sticky;left:12px;font-family:var(--mono)}
.cell{padding:8px 9px;min-height:116px;display:flex;flex-direction:column;gap:4px;cursor:pointer;transition:background .12s,opacity .12s;border-left:3px solid transparent}
.cell:hover{background:var(--hover)}
.cell.booked{border-left-color:var(--c)}
.cell .br{font-weight:600;font-size:13.5px}
.cell .an{font-size:12px;color:var(--muted)}
.cell .th{font-size:12.5px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cell .rg{margin-top:auto;font-size:11.5px;color:var(--muted);font-family:var(--mono)}
.cell .rg b{color:var(--ink);font-weight:600}
.cell.empty{cursor:default;color:var(--faint);font-size:12px;justify-content:center;align-items:center}
.cell.empty:hover{background:transparent}
.cell.dim{opacity:.22}
.legend{display:flex;flex-wrap:wrap;gap:8px 16px;margin-top:10px;font-size:12px;color:var(--muted)}

/* industry view */
.secbar{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:0;background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.secbtn{border:0;border-right:1px solid var(--line2);background:transparent;padding:12px 14px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;position:relative}
.secbtn:last-child{border-right:0}
.secbtn:hover{background:var(--hover)}
.secbtn .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.secbtn .nm i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.secbtn .ct{font-size:12px;color:var(--muted)}
.secbtn::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:transparent}
.secbtn[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 8%,var(--surface))}
.secbtn[aria-pressed="true"]::after{background:var(--c)}
.secbtn[aria-pressed="true"] .nm{color:var(--c)}
.subbar{display:flex;flex-wrap:wrap;gap:8px;padding:12px 2px 4px}
.subbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 12px;cursor:pointer;display:inline-flex;gap:8px;align-items:baseline}
.subbtn b{font-family:var(--mono);font-weight:500;font-size:12px;color:var(--muted)}
.subbtn:hover{border-color:var(--c)}
.subbtn[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff}
.subbtn[aria-pressed="true"] b{color:rgba(255,255,255,.85)}
:root[data-theme="dark"] .subbtn[aria-pressed="true"]{color:#0F141B}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .subbtn[aria-pressed="true"]{color:#0F141B}}
.isum{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:12px 0 14px}
.isum>div{padding:12px 16px;border-right:1px solid var(--line2)}
.isum>div:last-child{border-right:0}
.isum .l{font-size:12px;color:var(--muted)}
.isum .v{font-family:var(--mono);font-size:22px;font-weight:600;line-height:1.3}
.isum .v small{font-size:12px;color:var(--muted);font-weight:400;margin-left:2px}
.ibody{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
.iside{display:flex;flex-direction:column;gap:14px}
.tscroll{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{font-weight:500;color:var(--muted);font-size:12px;text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface2)}
table.tbl td{padding:9px 10px;border-bottom:1px solid var(--line2);vertical-align:top}
table.tbl tr.row{cursor:pointer}
table.tbl tr.row:hover td{background:var(--hover)}
table.tbl tr.grp td{background:var(--surface2);font-weight:600;font-size:12.5px;padding:6px 10px;border-bottom:1px solid var(--line2)}
table.tbl tr.grp td span{font-weight:400;color:var(--muted);margin-left:8px;font-family:var(--mono);font-size:12px}
table.tbl td.r,table.tbl th.r{text-align:right}
table.tbl .mono{font-family:var(--mono);font-size:12.5px;white-space:nowrap}
table.tbl .sub2{font-size:12px;color:var(--muted)}
table.tbl .nw{white-space:nowrap}
.mini{display:flex;flex-direction:column}
.mini .it{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px;align-items:center}
.mini .it:last-child{border-bottom:0}
.mini .it .s2{font-size:12px;color:var(--muted)}
.mini .it.click{cursor:pointer}
.mini .it.click:hover{background:var(--hover)}
.bkrow{display:grid;grid-template-columns:72px minmax(0,1fr) 22px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.bkrow .track{height:10px;background:var(--line2);border-radius:2px;overflow:hidden}
.bkrow .fill{height:100%;background:var(--c)}
.bkrow .n{font-family:var(--mono);text-align:right;color:var(--muted)}

/* stats */
.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .l{font-size:12px;color:var(--muted)}
.kpi .v{font-family:var(--mono);font-size:24px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:400;margin-left:2px}
.kpi .s{font-size:12px;color:var(--muted)}
.panels{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:14px}
.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}.c4{grid-column:span 4}.c8{grid-column:span 8}.c12{grid-column:span 12}
.hbar{display:grid;grid-template-columns:92px minmax(0,1fr) 40px;gap:8px;align-items:center;font-size:12.5px;padding:3px 0}
.hbar .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hbar .track{height:14px;background:var(--line2);border-radius:3px;overflow:hidden;display:flex}
.hbar .fill{height:100%;background:var(--c)}
.hbar .fill.lite{background:color-mix(in srgb,var(--c) 35%,transparent)}
.hbar .n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.hbar.click{cursor:pointer;border-radius:4px}
.hbar.click:hover{background:var(--hover)}
.hgroup{font-size:11.5px;color:var(--muted);letter-spacing:.08em;margin:10px 0 2px;display:flex;align-items:center;gap:6px}
.hgroup:first-of-type{margin-top:0}
.hgroup i{width:8px;height:8px;border-radius:2px;background:var(--c)}
.dual{display:grid;grid-template-columns:92px minmax(0,1fr) 84px;gap:8px;align-items:center;font-size:12.5px;padding:4px 0}
.dual .bars{display:flex;flex-direction:column;gap:2px}
.dual .b{height:8px;border-radius:2px}
.dual .b.reg{background:color-mix(in srgb,var(--accent) 30%,transparent)}
.dual .b.att{background:var(--accent)}
.dual .n{font-family:var(--mono);font-size:12px;text-align:right;color:var(--muted)}
.dual .n b{color:var(--ink);font-weight:600}
.keyrow{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
.keyrow i{display:inline-block;width:10px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0}
table.heat{border-collapse:separate;border-spacing:3px;width:100%;font-size:12.5px}
table.heat th{font-weight:500;color:var(--muted);padding:3px 6px;text-align:center;white-space:nowrap}
table.heat th.rl{text-align:left}
table.heat td{text-align:center;font-family:var(--mono);padding:5px 4px;border-radius:3px;min-width:44px;font-variant-numeric:tabular-nums}
table.heat td.z{color:var(--faint)}
.vbars{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;align-items:end;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
.vb{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.vb .col{width:70%;max-width:38px;background:var(--accent);border-radius:3px 3px 0 0}
.vb .n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.vlabels{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px;font-family:var(--mono);font-size:11px;color:var(--muted);text-align:center;padding-top:4px}
.rate{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12.5px}
.rate .rb{width:44px;height:6px;border-radius:3px;background:var(--line2);overflow:hidden;display:inline-block}
.rate .rb i{display:block;height:100%;background:var(--ok)}
.ptools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
.ptools input,.ptools select{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 10px;font-size:13px}
.ptools input{flex:1 1 200px;max-width:280px}
th.sort{cursor:pointer;user-select:none}
th.sort:hover{color:var(--ink)}
th.sort[aria-sort]{color:var(--ink)}

/* week + period controls */
.weekctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.weekctl .arrow{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:32px;height:34px;cursor:pointer;font-size:15px;line-height:1}
.weekctl .arrow:hover:not(:disabled){border-color:var(--accent);color:var(--accent)}
.weekctl .arrow:disabled{opacity:.35;cursor:default}
.weekctl select{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:34px;padding:0 10px;font-family:var(--mono);font-size:13px;max-width:100%}
.nowtag{font-size:11px;padding:2px 6px;border-radius:3px;background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.period{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:14px}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:6px;padding:5px 14px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.period select{border:1px solid var(--line);background:var(--surface);border-radius:6px;height:32px;padding:0 10px;font-size:13px}
.period .scope{font-size:13px;color:var(--muted)}
.period .scope b{color:var(--ink);font-family:var(--mono);font-weight:600}
.delta{font-family:var(--mono)}
.delta.up{color:var(--ok)} .delta.down{color:#C2453B}
.day:disabled{cursor:default;opacity:.55;background:var(--surface2)}
.day:disabled:hover{border-color:var(--line)}
.st.pending{--c:var(--accent)}


/* session types */
.cell.expert{background:var(--exp-bg);border-left-color:var(--exp-ink)}
.cell.corp{background:var(--corp-bg);border-left-color:var(--corp-ink)}
.cell.expert:hover,.cell.corp:hover{filter:brightness(.97)}
.ttag{display:inline-block;font-size:11.5px;line-height:1;padding:4px 7px;border-radius:4px;font-weight:600;white-space:nowrap}
.ttag.expert{color:var(--exp-ink);background:color-mix(in srgb,var(--exp-ink) 14%,transparent)}
.ttag.corp{color:var(--corp-ink);background:color-mix(in srgb,var(--corp-ink) 16%,transparent)}
.ttag.road{color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,transparent)}
.gh.online{background:color-mix(in srgb,var(--accent) 9%,var(--surface2))}
.gh .rt{font-family:var(--sans);font-size:11px;font-weight:500;color:var(--accent)}
.swatch{display:inline-block;width:14px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;border-left:3px solid var(--k)}
.pts{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.bio{font-size:13.5px;line-height:1.65;background:var(--surface2);border-radius:8px;padding:10px 12px}
.leaders{display:flex;flex-direction:column;gap:6px}
.leaders div{display:flex;justify-content:space-between;gap:8px;font-size:13.5px;padding:7px 10px;background:var(--surface2);border-radius:6px}
.leaders span{color:var(--muted);font-size:12px}
.fgroup{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.fgroup .sep{width:1px;height:20px;background:var(--line);margin:0 4px}


/* v5 additions */
.brand{display:flex;align-items:center;gap:14px}
.logo{width:52px;height:52px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex:none;padding:0}
.logo img{width:100%;height:100%;object-fit:contain}
.logo .mono-mark{font-family:var(--serif);font-weight:700;font-size:13px;line-height:1.15;color:var(--accent);text-align:center;letter-spacing:.05em}
.logo:hover{border-color:var(--accent)}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.frow .flabel{font-size:12px;color:var(--muted);width:56px;flex:none}
.filters2{display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.gt.lunchrow,.cell.lunchslot{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--warn) 7%,var(--surface)) 0 6px,var(--surface) 6px 12px)}
.gt.lunchrow{color:var(--warn)}
.cell.lunchslot.booked{background:color-mix(in srgb,var(--warn) 8%,var(--surface))}
.ltag{display:inline-block;font-size:11px;line-height:1;padding:3px 6px;border-radius:3px;color:var(--warn);background:color-mix(in srgb,var(--warn) 14%,transparent);font-weight:600;margin-left:4px}
.cell.blank{cursor:default}
.cell.blank:hover{background:transparent}
.cell .org{font-size:12px;color:var(--ink)}
.cell .org b{font-weight:600}
.award{display:inline-block;font-size:11px;padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);margin:0 4px 4px 0;white-space:nowrap}
.award.s{border-color:color-mix(in srgb,var(--accent) 40%,var(--line));color:var(--accent)}
.award.j{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}
.teamrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px;padding:7px 6px;border-bottom:1px solid var(--line2);cursor:pointer;border-radius:4px}
.teamrow:hover{background:var(--hover)}

/* keyword add */
.kwadd{display:flex;gap:8px;margin-top:8px;max-width:420px}

.lgd{display:flex;flex-direction:column;gap:8px}

.lgd .li b{font-family:var(--mono);font-weight:700;color:var(--ink)}

.sb .n{font-family:var(--mono);text-align:right;color:var(--muted)}

  -webkit-mask-image:radial-gradient(ellipse 60% 70% at 60% 50%,#000 30%,transparent 75%);mask-image:radial-gradient(ellipse 60% 70% at 60% 50%,#000 30%,transparent 75%)}

.tabs{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0;margin:18px 0 20px;width:100%;gap:28px}
.tab{background:transparent!important;border-radius:0;padding:12px 2px 11px;color:var(--muted);font-size:15px;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:baseline;gap:8px}

.card,.panel,.kpi,.gridbox,.secbar,.day,.subbtn,.seg{border-radius:2px}
.panel{padding:0 0 14px;overflow:hidden}
.panel>h3,.panel h3{font-family:var(--sans);font-size:14px;font-weight:600;color:var(--navy);letter-spacing:.04em}
.panel>h3:first-child{margin:0;padding:11px 16px;background:var(--tint2);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.panel>h3:first-child::before{content:"";width:4px;height:14px;background:var(--navy)}
.panel>.sub:nth-child(2){padding:8px 16px 0}
.panel>*:not(h3:first-child):not(.sub:nth-child(2)){margin-left:16px;margin-right:16px}
.panel h3:not(:first-child){display:flex;align-items:center;gap:8px}
.panel h3:not(:first-child)::before{content:"";width:8px;height:8px;background:var(--gold)}
.kpi{border:1px solid var(--line);border-top:3px solid var(--navy);padding:12px 16px}
.kpi:nth-child(2n){border-top-color:var(--gold)}
.kpi .l{color:var(--muted);letter-spacing:.04em}
.kpi .v{font-family:var(--mono);color:var(--navy);font-weight:700}
.isum{border-top:3px solid var(--navy)}
.isum .v{font-family:var(--mono);color:var(--navy);font-weight:700}

/* day picker */
.day{border-color:var(--line)}
.day .d,.day .n{color:var(--muted)}
.day[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);box-shadow:none}
.day[aria-pressed="true"] .w,.day[aria-pressed="true"] .d,.day[aria-pressed="true"] .n{color:#fff}
.day[aria-pressed="true"] .w{color:#fff}
.day[aria-pressed="true"]::after{content:"";display:block;height:2px;background:var(--gold2);margin:6px -10px -8px}

/* filters */
.frow .flabel{color:var(--navy);font-weight:600;letter-spacing:.06em}
.fbtn{border-radius:2px;border-color:var(--line);color:var(--sub);background:var(--surface)}
.fbtn:hover{border-color:var(--navy);color:var(--navy)}
.fbtn[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.fbtn[aria-pressed="true"] .num{color:rgba(255,255,255,.75)!important}

/* schedule grid */
.gridbox{border-color:var(--line)}
.gh{background:var(--navy);color:#fff;font-family:var(--mono);letter-spacing:.04em}
.gh small{color:rgba(255,255,255,.65)}
.gh.online{background:var(--navy2)}
.gh.corner{background:var(--navy2);color:rgba(255,255,255,.8)}
.gt{background:var(--surface2);color:var(--navy);font-family:var(--mono);font-weight:600}
.gt span{color:var(--faint);font-weight:400}
.gt.lunchrow{color:var(--gold)}
.cell .br{color:var(--ink)}
.cell .th{color:var(--sub)}
.cell .rg{font-family:var(--mono);color:var(--muted)}
.cell .rg b{color:var(--navy)}
.roombadge{font-family:var(--mono);color:var(--navy);opacity:.9}
.roombadge.on{color:var(--gold)}
.chip{border-radius:2px}
.ltag{border-radius:2px}
.ttag{border-radius:2px}

/* industry view */
.secbar{border-color:var(--line)}
.secbtn[aria-pressed="true"]{background:var(--tint2)}
.secbtn[aria-pressed="true"]::after{background:var(--gold)}
.subbtn{border-radius:2px}
table.tbl th{background:var(--navy);color:#fff;border-bottom:0;letter-spacing:.04em}
table.tbl tr.grp td{background:var(--tint2);color:var(--navy)}
table.tbl tr:nth-child(even):not(.grp) td{background:#FAFBFD}
table.tbl tr.row:hover td{background:var(--hover)}
table.heat th{color:var(--sub)}
.teamrow[aria-pressed="true"]{background:var(--tint2);box-shadow:inset 3px 0 0 var(--gold)}

/* period switch */
.seg{border-color:var(--line)}
.seg button{border-radius:2px}
.seg button[aria-pressed="true"]{background:var(--navy);color:#fff}
.period .scope b{font-family:var(--mono);color:var(--navy)}

/* sheet */
.sheet{border-left:3px solid var(--gold)}
.sheet h2{font-family:var(--sans);font-weight:600;color:var(--navy)}
.sheet h4{color:var(--navy);font-weight:600;border-left:3px solid var(--navy);padding-left:8px}
.linkbtn{border-radius:2px}
.foot{color:var(--faint);border-top:1px solid var(--line);padding-top:12px}

/* v6 contrast fixes */
table.tbl th.sort,table.tbl th.sort[aria-sort]{color:#fff}
table.tbl th.sort:hover{color:var(--gold2)}
.chip{color:color-mix(in srgb,var(--c) 70%,#111827);background:color-mix(in srgb,var(--c) 11%,#fff)}
.btn{background:var(--navy);border-color:var(--navy)}
.btn.ghost{background:transparent;color:var(--navy)}
.okt{color:#2E7D5B}
.tm{border-left-color:var(--gold)}
.tm .no{color:var(--navy)}
.userbox .who span{color:rgba(255,255,255,.7)}
</style>
</head>

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const rnd=mulberry32(20260914);
const ri=n=>Math.floor(rnd()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=ri(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const wpickN=(arr,n)=>{const pool=arr.slice(),out=[];while(out.length<n&&pool.length){const tot=pool.reduce((s,x)=>s+x.w,0);let r=rnd()*tot,i=0;for(;i<pool.length;i++){r-=pool[i].w;if(r<=0)break}out.push(pool.splice(Math.min(i,pool.length-1),1)[0])}return out};

}
function render(){
  $('#wkSel').innerHTML=WEEKS.map(w=>`<option value="${w.i}"${w.i===st.wk?' selected':''}>${w.label}${w.current?'（本周）':''}</option>`).join('');

function setWeek(i){
  const k=DAYS[st.day].k;
  st.wk=Math.max(0,Math.min(WEEKS.length-1,i));
  const w=weekOf();
  st.day=w.days.find(d=>DAYS[d].k===k&&!DAYS[d].hol)??workDays(w.days)[0];
  st.month=Math.min(10,Math.max(7,DAYS[w.days[2]].m));

}

  const lc=x.lunch?' lunchslot':'';

    <div>${chip(x.ind)}</div><div class="br">${esc(x.theme)}</div>${org}<div class="an">${esc(x.ex.who)} · ${esc(x.ex.bg.split('，')[0])}</div>${foot}</div>`;

    });
  });
  $('#grid').innerHTML=h;
}

function personStats(L){

function submitEntry(){

  if(f.type==='expert'){theme=String(f.theme||'').trim();if(!theme)return err('请填写交流主题');if(!String(f.who||'').trim())return err('请填写专家称呼')}

  if(online&&!freeOnline(dayIdx,f.slot,editing))return err('该时段 5 个线上会议位已满，请换一个时段');
  const data={type:f.type,date:f.date,slot:f.slot,online,room:f.room,ind:f.ind,broker:ME.key==='sale'?ME.broker:f.broker,analyst:String(f.analyst||'').trim(),theme,kw:f.kw,who:String(f.who||'').trim(),bg:String(f.bg||'').trim(),

  const key=editing?editing.key:'n'+(++store.seq);
  const op={op:editing?'edit':'add',key,data};store.ops.push(op);applyOp(op);reindex();saveStore();
  const s=byKey(key);logAct(editing?'修改安排':'新增安排',`${DAYS[dayIdx].s} ${SLOTS[f.slot][0]} ${TYPES[f.type]} · ${headline(s)}`);
  toast(editing?'已保存修改':'已新增安排');

  st.wk=DAYS[dayIdx].wk;render();
}

function donutSVG(parts,center,label){
  const tot=parts.reduce((a,p)=>a+p.v,0)||1,R=54,Cc=2*Math.PI*R,live=parts.filter(p=>p.v);let off=0;
  const segs=live.map(p=>{const len=p.v/tot*Cc,g=live.length>1?2.5:0,d=Math.max(0,len-g);
    const s=`<circle r="${R}" cx="70" cy="70" fill="none" stroke="${p.c}" stroke-width="20" stroke-dasharray="${d} ${Cc-d}" stroke-dashoffset="${-off}" data-tip="${esc(p.l)}：${p.v}${p.u||''}（${pct(p.v,tot)}%）"/>`;off+=len;return s}).join('');
  return `<svg viewBox="0 0 140 140" class="donut" role="img" aria-label="${esc(label)}"><circle r="${R}" cx="70" cy="70" fill="none" stroke="var(--line2)" stroke-width="20"/><g transform="rotate(-90 70 70)">${segs}</g><text x="70" y="68" text-anchor="middle" class="dv">${center[0]}</text><text x="70" y="87" text-anchor="middle" class="dl">${center[1]}</text></svg>`;
}

  const tparts=Object.keys(TYPES).map(k=>({l:TYPES[k],v:tc.get(k)||0,c:TCOL[k],u:' 场'}));
  const formRow=k=>{const l=L.filter(s=>s.type===k),on=l.filter(s=>s.online).length,off=l.length-on;return `<div class="sb"><span class="t">${TYPES[k]}</span><span class="bar">${off?`<span style="flex:${off};background:${FCOL.off}" data-tip="${TYPES[k]} · 线下：${off} 场"></span>`:''}${on?`<span style="flex:${on};background:${FCOL.on}" data-tip="${TYPES[k]} · 线上：${on} 场"></span>`:''}${!l.length?'<span style="flex:1;background:var(--line2)"></span>':''}</span><span class="n">线下 ${off} · 线上 ${on}</span></div>`};
  h+=`<div class="panels"><div class="panel c5"><h3>服务形式</h3><div class="sub">按日程类型 · 场次</div><div class="dn">${donutSVG(tparts,[L.length,'场服务'],'服务形式构成')}${legendHTML(tparts,' 场')}</div>

  // 2 trend
  const bk=sc.trend.map(b=>{const set=new Set(b.days),l=L.filter(s=>set.has(s.day));const v={};Object.keys(TYPES).forEach(k=>v[k]=l.filter(s=>s.type===k).length);return {l:b.l,l2:b.l2,v,r:regN(l)}});
  h+=`<div class="panel c7"><h3>服务场次趋势</h3><div class="sub">按${sc.kind==='周'?'日':'周'}统计 · 堆叠显示三类服务</div><div class="lgd row">${Object.keys(TYPES).map(k=>`<div class="li"><i style="background:${TCOL[k]}"></i><span class="t">${TYPES[k]}</span></div>`).join('')}</div>${colChart(bk,Object.keys(TYPES),TCOL,TYPES,' 场')}

  // 5 topics
  const kwm=new Map();L.forEach(s=>{const ks=s.type==='road'?(s.kw||[]):s.type==='corp'?[s.co.name]:[];ks.forEach(k=>{const o=kwm.get(k)||{n:0,r:0};o.n++;o.r+=s.regs.length;kwm.set(k,o)})});
  const kws=[...kwm].sort((a,b)=>b[1].r-a[1].r||b[1].n-a[1].n).slice(0,36), kmx=Math.max(1,...kws.map(k=>k[1].r)), kmn=Math.min(...kws.map(k=>k[1].r));
  const cloud=kws.map(([k,o],i)=>{const f=(o.r-kmn)/Math.max(1,kmx-kmn);return {k,o,f,i}}).sort((a,b)=>hash(a.k)%97-hash(b.k)%97)
    .map(({k,o,f})=>`<span class="kwc" style="font-size:${(12.5+f*15).toFixed(1)}px;color:color-mix(in srgb,#1C4885 ${Math.round(45+f*55)}%,#9AA3AF)" data-tip="${esc(k)}：${o.n} 场 · 报名 ${o.r} 人次">${esc(k)}</span>`).join('');
  const topTh=L.slice().sort((a,b)=>b.regs.length-a.regs.length).slice(0,8), tmx=Math.max(1,...topTh.map(s=>s.regs.length));
  h+=`<div class="panel c6"><h3>热门场次</h3><div class="sub">报名人次最多的场次</div>${topTh.map(s=>`<div class="hb2 th row" tabindex="0" data-id="${s.id}" data-tip="${esc(DAYS[s.day].s)} ${timeTxt(s)} · 报名 ${s.regs.length} 人次"><span class="t">${ttag(s.type)} ${esc(headline(s))}</span><span class="track"><span class="fill" style="width:${s.regs.length/tmx*100}%;background:${TCOL[s.type]}"></span></span><span class="n">${s.regs.length}</span></div>`).join('')}</div>
    <div class="panel c12"><h3>交流主题热度</h3><div class="sub">关键词 / 公司 · 字号越大报名越多</div><div class="cloud">${cloud}</div></div>`;
  // 6 slots
  const bs=SLOTS.map((sl,i)=>({l:sl[0],l2:i===LUNCH?'午餐':'',v:{n:L.filter(s=>s.slot===i).length}}));
  h+=`<div class="panel c12"><h3>时段分布</h3><div class="sub">各时段服务场次（12:00 为午餐路演）</div>${colChart(bs,['n'],{n:'#2A5BA8'},{n:'场次'},' 场')}</div></div>`;
  $('#ssBody').innerHTML=h;
}

(function(){const tip=document.createElement('div');tip.className='ctip';tip.hidden=true;document.body.appendChild(tip);

    tip.textContent=t.getAttribute('data-tip');tip.hidden=false;const w=tip.offsetWidth;let x=e.clientX+14;if(x+w>innerWidth-8)x=e.clientX-w-14;tip.style.left=x+'px';tip.style.top=(e.clientY+16)+'px'});

function showLogin(){ME=null;$('#app').hidden=true;$('#login').hidden=false;renderLogin();setTimeout(()=>{const el=$('#lgU');if(el)el.focus()},0)}
function enterApp(){
  $('#login').hidden=true;$('#login').innerHTML='';$('#app').hidden=false;
  $('#userbox').innerHTML=`<div class="who"><b>${esc(ME.name)}</b><span>${esc(ME.label)} · ${esc(ME.u)}</span></div><button id="logoutBtn" type="button">退出登录</button>`;
  $('#tabs').innerHTML=ROLE_TABS[ME.key].map((v,i)=>`<button class="tab" role="tab" id="tab-${v}" data-view="${v}"><span class="tn">${pad(i+1)}</span>${ME.key==='sale'&&v==='entry'?'录入与修改':TAB_LABEL[v]}</button>`).join('');
  st.form=null;st.editKey=null;st.entryMode='add';st.pending=null;
  const h0=(location.hash||'').slice(1);
  setView(ROLE_TABS[ME.key].includes(h0)?h0:ROLE_TABS[ME.key][0]);
}
function doLogin(){
  const u=String($('#lgU').value||'').trim().toLowerCase(), p=String($('#lgP').value||'');
  const user=USERS.find(x=>x.u.toLowerCase()===u||x.alias.includes(u));
  if(!user||p.toLowerCase()!==user.pw.toLowerCase()){$('#lgErr').textContent='用户名或密码不正确，请重试';return}
  ME=user;try{localStorage.setItem('rsb-user',user.key)}catch(e){}
  logAct('登录','');enterApp();
}
function logout(){if(ME)logAct('退出','');try{localStorage.removeItem('rsb-user')}catch(e){}closeDetail();showLogin()}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-view],[data-day],[data-tf],[data-sector],[data-sub],[data-mode],[data-layout],[data-isec],[data-ind],[data-team],[data-id],[data-pid],[data-goind],[data-psort],[data-period],[data-reg],[data-unreg],[data-regforce],[data-regcancel],[data-copy],[data-fill],[data-emode],[data-edit],[data-del],[data-delok],[data-delno],[data-editcancel],[data-formreset],[data-kwadd],#closeSheet,#scrim,#wkPrev,#wkNext,#logoutBtn');
  if(!t||t.disabled)return;
  if(e.target.closest('a[href]'))return;
  const d=t.dataset;
  if(t.id==='logoutBtn')return logout();
  if(d.fill!=null){const u=USERS.find(x=>x.key===d.fill);$('#lgU').value=u.u;$('#lgP').value=u.pw;$('#lgErr').textContent='';return}
  if(t.id==='closeSheet'||t.id==='scrim')return closeDetail();
  if(d.copy!=null){const v=d.copy;try{navigator.clipboard.writeText(v).then(()=>toast('已复制会议链接'),()=>toast('会议链接：'+v))}catch(err){toast('会议链接：'+v)}return}
  if(d.reg!=null)return doReg(+d.reg,false);
  if(d.regforce!=null)return doReg(+d.regforce,true);
  if(d.regcancel!=null){st.pending=null;return openDetail(sheetId)}
  if(d.unreg!=null)return doUnreg(+d.unreg);
  if(d.emode){st.entryMode=d.emode;st.delKey=null;return renderEntry()}
  if(d.edit!=null)return loadEdit(d.edit);
  if(d.delok!=null)return doDelete(d.delok);
  if(d.del!=null){st.delKey=d.del;return renderEntry()}
  if(d.delno!=null){st.delKey=null;return renderEntry()}
  if(d.editcancel!=null){st.editKey=null;st.form=newForm();st.formMsg='';st.entryMode='edit';return renderEntry()}
  if(d.kwadd!=null)return addKw();
  if(d.formreset!=null){st.form=newForm();st.formMsg='';return renderEntry()}
  if(t.id==='wkPrev')return setWeek(st.wk-1);
  if(t.id==='wkNext')return setWeek(st.wk+1);
  if(d.view)return setView(d.view);
  if(d.period){st.period=d.period;return render()}
  if(d.day!=null){st.day=+d.day;return renderDate()}
  if(d.tf){st.tf=d.tf;return renderDate()}
  if(d.sector){st.sector=d.sector;st.sub='all';return renderDate()}
  if(d.sub){st.sub=d.sub;return renderDate()}
  if(d.mode){st.mode=d.mode;return renderDate()}
  if(d.layout){st.layout=d.layout;return renderDate()}
  if(d.isec){st.isec=d.isec;st.ind='all';st.team=null;return renderIndustry()}
  if(d.ind){st.ind=d.ind;st.team=null;return renderIndustry()}
  if(d.team!=null){st.team=d.team&&st.team!==d.team?d.team:null;return renderIndustry()}
  if(d.goind){st.ind=d.goind;st.isec=indOf(d.goind).s;st.team=null;if(d.gowk!=null&&+d.gowk!==st.wk){st.wk=+d.gowk;st.day=workDays(weekOf().days)[0]??weekOf().days[0]}closeDetail();return setView('industry')}
  if(d.psort){if(st.psort===d.psort)st.pdir*=-1;else{st.psort=d.psort;st.pdir=d.psort==='name'?1:-1}return renderPTable()}
  if(d.pid!=null)return openPerson(+d.pid);
  if(d.id!=null)return openDetail(+d.id);
});
document.addEventListener('submit',e=>{
  if(e.target.id==='loginForm'){e.preventDefault();doLogin()}
  else if(e.target.id==='entryForm'){e.preventDefault();submitEntry()}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.form&&t.form.id==='entryForm'&&!(t.type==='text'||t.tagName==='TEXTAREA')){readForm();st.formMsg='';renderEntry();return}
  if(t.id==='etf'){st.etf=t.value;return renderEntry()}
  if(t.id==='ssb'){st.ssb=t.value;return renderSaleStats()}
  if(t.id==='logU'){st.logU=t.value;return renderLog()}
  if(t.id==='logA'){st.logA=t.value;return renderLog()}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.form&&t.form.id==='entryForm'){if(t.type==='text'||t.tagName==='TEXTAREA')readForm();return}
  if(t.id==='pq'){st.pq=t.value.trim();renderPTable()}
  else if(t.id==='pdept'){st.pdept=t.value;renderPTable()}
  else if(t.id==='wkSel'){setWeek(+t.value)}
  else if(t.classList.contains('monthSel')){st.month=+t.value;render()}
  else if(t.classList.contains('qSel')){st.q=+t.value;render()}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.id==='kwNew'){e.preventDefault();return addKw()}
  if(e.key==='Escape'&&!$('#sheet').hidden)return closeDetail();
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-id],div[data-id],[data-pid]:not(button),[data-team]:not(button),.hbar[data-goind]')){e.preventDefault();e.target.click()}
});
{let k=null;try{k=localStorage.getItem('rsb-user')}catch(e){}
 const u=USERS.find(x=>x.key===k);if(u){ME=u;enterApp()}else showLogin();}
})();
